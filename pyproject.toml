[project]
name = "future-music"
version = "0.1.0"
description = "Empath Conductor AI DJ (Prototype 0.1): Sample-Locked Stem Weaver, Modal Lookahead Bridge Compiler, and Headless GarageBand/IAC Synth Conductor"
readme = "README.md"
authors = [
    { name = "Yami Gopal", email = "gopal.yami@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "mido>=1.3.3",
    "numpy>=2.2.0",
    "pydantic>=2.13.5",
    "python-rtmidi>=1.5.8",
    "scipy>=1.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
empath-conductor = "future_music.infrastructure.fastapi_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 3
